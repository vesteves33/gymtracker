services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gymtracker
      POSTGRES_PASSWORD: gymtracker
      POSTGRES_DB: gymtracker
    ports:
      - "5432:5432"
    volumes:
      - gymtracker_db_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://gymtracker:gymtracker@db:5432/gymtracker
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    ports:
      - "8000:8000"

volumes:
  gymtracker_db_data:
