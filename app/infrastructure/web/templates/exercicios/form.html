{% extends "base.html" %}
{% block nav %}
<form method="post" action="/logout" style="display:inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">Sair</button>
</form>
{% endblock %}
{% block content %}
<h1>{% if exercicio %}Editar{% else %}Novo{% endif %} exercicio</h1>
{% if erro %}<p style="color:red">{{ erro }}</p>{% endif %}
<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Nome <input type="text" name="nome" value="{{ exercicio.nome if exercicio else '' }}"></label>
    <label>Tipo
        <select name="tipo">
            <option value="musculacao" {% if exercicio and exercicio.tipo.value == "musculacao" %}selected{% endif %}>Musculacao</option>
            <option value="aerobico" {% if exercicio and exercicio.tipo.value == "aerobico" %}selected{% endif %}>Aerobico</option>
        </select>
    </label>
    <button type="submit">Salvar</button>
</form>
{% endblock %}
